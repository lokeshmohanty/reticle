# Reticle Theme for Zola
# An instrument-reading design system for Zola — Space Grotesk + Nunito + Cascadia Code typography, semantic accents (proved/obligation/blocking), and the margin-tape signature element. Supports documentation (with versioning), e-books, blogs, and product landing pages.

name = "reticle"
description = "An instrument-reading design system for Zola — Space Grotesk + Nunito + Cascadia Code typography, semantic accents (proved/obligation/blocking), and the margin-tape signature element. Supports documentation (with versioning), e-books, blogs, and product landing pages."
license = "MIT"
homepage = "https://github.com/lokeshmohanty/reticle"
repository = "https://github.com/lokeshmohanty/reticle"
min_version = "0.19.0"
demo = "https://lokeshmohanty.github.io/reticle"

[author]
name = "Lokesh Mohanty"
homepage = "https://lokeshmohanty.in"
# Originally created by Raffael Schneider (https://raskell.io)

[extra]
# Theme mode: "docs", "book", "site", or "product"
mode = "site"

[extra.docs]
# Documentation-specific settings
versioned = true
default_version = "latest"

[extra.book]
# E-book-specific settings
show_landing = true

[extra.site]
# Blog/landing page settings
show_hero = true

