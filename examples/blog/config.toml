# Tanuki Theme - Blog/Personal Site Example
base_url = "/tanuki/blog"
title = "Lokesh Mohanty"
description = "PhD researcher and engineer writing about autonomous systems, web technologies, and software design."
theme = "tanuki"
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
    { name = "tags", feed = true },
]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
mode = "blog"
show_theme_toggle = true
show_about_section = true

# Author info
[extra.author]
name = "Lokesh Mohanty"
bio = "PhD researcher in autonomous systems & software engineer."

# Hero section
[extra.hero]
title = "Hey, I'm Lokesh"
subtitle = "I research autonomous systems, build software, and write about what I learn."
[extra.hero.cta]
text = "Read the blog"
url = "/tanuki/blog/blog/"

# About preview on homepage
[extra.about]
summary = "I'm a PhD researcher studying lifelong learning for planning in autonomous systems and a software engineer passionate about developer experience and AI systems."

# Social links
[extra.social]
github = "https://github.com/lokeshmohanty"

# Navigation
[[extra.nav]]
name = "Blog"
url = "/tanuki/blog/blog/"

[[extra.nav]]
name = "Projects"
url = "/tanuki/blog/projects/"

[[extra.nav]]
name = "About"
url = "/tanuki/blog/about/"
